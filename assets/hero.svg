<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Muhammad Faiz Ramadhan — Full Stack Engineer, AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.62" stop-color="#0d0b16"/>
      <stop offset="1" stop-color="#120e1f"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="1" r="0.72">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#3B1D6E"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect y="150" width="1600" height="270" fill="url(#horizon)"/>

  <!-- perspective floor -->
  <g stroke="#7C3AED" stroke-opacity="0.22" stroke-width="1">
    <line x1="-260" y1="420" x2="800" y2="210"/>
    <line x1="-20" y1="420" x2="800" y2="210"/>
    <line x1="220" y1="420" x2="800" y2="210"/>
    <line x1="460" y1="420" x2="800" y2="210"/>
    <line x1="700" y1="420" x2="800" y2="210"/>
    <line x1="900" y1="420" x2="800" y2="210"/>
    <line x1="1140" y1="420" x2="800" y2="210"/>
    <line x1="1380" y1="420" x2="800" y2="210"/>
    <line x1="1620" y1="420" x2="800" y2="210"/>
    <line x1="1860" y1="420" x2="800" y2="210"/>
    <line x1="0" y1="232" x2="1600" y2="232" stroke-opacity="0.12"/>
    <line x1="0" y1="252" x2="1600" y2="252" stroke-opacity="0.14"/>
    <line x1="0" y1="278" x2="1600" y2="278" stroke-opacity="0.16"/>
    <line x1="0" y1="312" x2="1600" y2="312" stroke-opacity="0.18"/>
    <line x1="0" y1="356" x2="1600" y2="356" stroke-opacity="0.2"/>
    <line x1="0" y1="410" x2="1600" y2="410" stroke-opacity="0.22"/>
  </g>

  <!-- floating glass panels -->
  <g>
    <rect x="1090" y="86" width="300" height="176" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="1112" y="110" width="120" height="9" rx="4.5" fill="#A78BFA" fill-opacity="0.85"/>
    <rect x="1112" y="132" width="232" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="1112" y="150" width="198" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1112" y="168" width="216" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1112" y="200" width="92" height="30" rx="15" fill="url(#accent)" fill-opacity="0.9"/>
  </g>

  <g opacity="0.9">
    <rect x="1216" y="286" width="214" height="86" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="1236" y="308" width="58" height="8" rx="4" fill="#A78BFA" fill-opacity="0.8"/>
    <rect x="1236" y="328" width="160" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="1236" y="344" width="124" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  </g>

  <!-- isometric cube -->
  <g transform="translate(1010 250)">
    <polygon points="0,-46 40,-24 40,24 0,46 -40,24 -40,-24" fill="#7C3AED" fill-opacity="0.12"/>
    <polygon points="0,-46 40,-24 0,-2 -40,-24" fill="url(#cubeTop)"/>
    <polygon points="-40,-24 0,-2 0,46 -40,24" fill="url(#cubeLeft)"/>
    <polygon points="40,-24 0,-2 0,46 40,24" fill="url(#cubeRight)"/>
    <polygon points="0,-46 40,-24 0,-2 -40,-24" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="88" y="146" fill="#A78BFA" font-size="13" letter-spacing="6" font-weight="600">FULL STACK ENGINEER · AI / ML</text>
    <text x="88" y="205" fill="#f4f4f5" font-size="52" font-weight="700" letter-spacing="0.5">Muhammad Faiz Ramadhan</text>
    <text x="88" y="243" fill="#9ca3af" font-size="17" letter-spacing="0.4">Scalable systems, production ML, product-first engineering.</text>
    <rect x="88" y="268" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="88" y="330" fill="#6b7280" font-size="13" letter-spacing="3">JAKARTA, INDONESIA · OPEN TO COLLABORATION</text>
  </g>
</svg>
